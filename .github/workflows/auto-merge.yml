name: Auto-merge on 2 approvals

# Uses a cron schedule instead of pull_request_review because GitHub requires
# manual maintainer approval for any workflow triggered by fork PRs, and
# downgrades the GITHUB_TOKEN to read-only for fork-triggered runs. Since this
# repo uses a fork-based contribution model, a cron trigger is the only way to
# auto-merge without manual intervention per PR.
#
# NOTE: GitHub silently disables scheduled workflows on repos with no activity
# (commits, PRs, issues) for 60 days. If this repo goes dormant between
# cohorts, re-enable the workflow from the Actions tab before the next cohort.
#
# Uses a classic PAT (MERGE_TOKEN repo secret) instead of GITHUB_TOKEN because:
# 1. GITHUB_TOKEN cannot merge through branch protection (enforce_admins only
#    exempts human admins, not the Actions bot)
# 2. Fine-grained PATs also fail — they don't inherit admin bypass
# 3. The PAT needs both `repo` and `workflow` scopes — `workflow` is required
#    because some PRs include .github/workflows/ changes and GitHub blocks
#    merging those without it
#
# PAT EXPIRATION: The MERGE_TOKEN secret expires 2026-07-30. When it expires,
# runs succeed but merges silently fail (401). Renew at:
#   https://github.com/settings/tokens → create new classic PAT (repo + workflow)
#   https://github.com/lana-z/aispire-tutor/settings/secrets/actions → update MERGE_TOKEN

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check open PRs and merge approved ones
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.MERGE_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const { data: pulls } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
            });

            console.log(`Found ${pulls.length} open PR(s)`);

            for (const pr of pulls) {
              console.log(`\n--- PR #${pr.number}: ${pr.title} ---`);

              const { data: reviews } = await github.rest.pulls.listReviews({
                owner,
                repo,
                pull_number: pr.number,
              });

              // Count unique approvals (latest review per user)
              const latestByUser = {};
              for (const review of reviews) {
                latestByUser[review.user.login] = review.state;
              }
              const approvals = Object.values(latestByUser).filter(s => s === 'APPROVED').length;
              console.log(`Approvals: ${approvals}`);

              if (approvals < 2) {
                console.log('Not enough approvals, skipping.');
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                });
                console.log(`PR #${pr.number} merged.`);
              } catch (err) {
                console.log(`PR #${pr.number} could not be merged: ${err.message}`);
              }
            }
